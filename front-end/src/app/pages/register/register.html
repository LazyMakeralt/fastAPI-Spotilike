<div class="auth-container">
  <div class="card auth-card">
    <h1>Créer un compte</h1>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="username">Nom d'utilisateur :</label>
        <input id="username" type="text" formControlName="username" class="form-control">
        <div *ngIf="registerForm.get('username')?.invalid && (registerForm.get('username')?.dirty || registerForm.get('username')?.touched)" class="error-message">
            Le nom d'utilisateur est requis.
        </div>
      </div>
      
      <div class="form-group">
        <label for="email">Email :</label>
        <input id="email" type="email" formControlName="email" class="form-control">
        <div *ngIf="registerForm.get('email')?.invalid && (registerForm.get('email')?.dirty || registerForm.get('email')?.touched)" class="error-message">
            <span *ngIf="registerForm.get('email')?.errors?.['required']">L'email est requis.</span>
            <span *ngIf="registerForm.get('email')?.errors?.['email']">Format d'email invalide.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe :</label>
        <input id="password" type="password" formControlName="password" class="form-control">
        <div *ngIf="registerForm.get('password')?.invalid && (registerForm.get('password')?.dirty || registerForm.get('password')?.touched)" class="error-message">
            <span *ngIf="registerForm.get('password')?.errors?.['required']">Le mot de passe est requis.</span>
            <span *ngIf="registerForm.get('password')?.errors?.['minlength']">Minimum 6 caractères.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmer mot de passe :</label>
        <input id="confirmPassword" type="password" formControlName="confirmPassword" class="form-control">
        <div *ngIf="registerForm.errors?.['mismatch'] && (registerForm.get('confirmPassword')?.dirty || registerForm.get('confirmPassword')?.touched)" class="error-message">
            Les mots de passe ne correspondent pas.
        </div>
      </div>

      <p *ngIf="errorMessage" class="error-message general-error">{{ errorMessage }}</p>
      <p *ngIf="successMessage" class="success-message general-success">{{ successMessage }}</p>

      <button type="submit" [disabled]="registerForm.invalid" class="btn-primary full-width">S'inscrire</button>

    </form>

    <p class="auth-footer">
      Déjà un compte ? <a [routerLink]="['/login']">Se connecter</a>
    </p>
  </div>
</div>
