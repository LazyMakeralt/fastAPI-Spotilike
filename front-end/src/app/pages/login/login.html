<div class="auth-container">
  <div class="card auth-card">
    <h1>Connexion</h1>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="email">Email :</label>
        <input id="email" type="email" formControlName="email" class="form-control">
        <div *ngIf="loginForm.get('email')?.invalid && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)" class="error-message">
            <span *ngIf="loginForm.get('email')?.errors?.['required']">L'email est requis.</span>
            <span *ngIf="loginForm.get('email')?.errors?.['email']">Format d'email invalide.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe :</label>
        <input id="password" type="password" formControlName="password" class="form-control">
        <div *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)" class="error-message">
            Le mot de passe est requis.
        </div>
      </div>

      <p *ngIf="errorMessage" class="error-message general-error">{{ errorMessage }}</p>

      <button type="submit" [disabled]="loginForm.invalid" class="btn-primary full-width">Se connecter</button>

    </form>

    <p class="auth-footer">
      Pas encore de compte ? <a [routerLink]="['/register']">Créer un compte</a>
    </p>
  </div>
</div>
